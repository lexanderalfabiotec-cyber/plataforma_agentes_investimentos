services:

  # ── Ollama ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"           # expõe para o host (útil para testes locais)
    volumes:
      - ollama_data:/root/.ollama  # persiste os modelos baixados
    networks:
      - plataforma_net
    healthcheck:
      test: ["CMD", "ollama", "list"]  # verifica se o servidor está pronto
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    # ── GPU NVIDIA (comente se não tiver GPU disponível) ────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Pull automático do modelo ─────────────────────────────────────────────
  # Roda uma única vez, baixa o modelo e encerra (restart: no)
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    restart: "no"               # one-shot: encerra após completar
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "⏳ Aguardando Ollama ficar pronto..."
        ollama pull lfm3
        echo "✅ Modelo lfm3 baixado com sucesso!"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy  # só inicia após o healthcheck passar
    networks:
      - plataforma_net

  # ── Agentes Python (Streamlit) ────────────────────────────────────────────
  agentes:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: agentes-ia
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # Aponta o cliente ollama para o serviço interno — NÃO use localhost aqui
      - OLLAMA_HOST=http://ollama:11434
      # URL do backend Go para chamadas de ticker via ticker_client.py
      - BACKEND_URL=http://backend:8080
    env_file:
      - .env                    # variáveis secretas (API keys, etc.)
    volumes:
      - ./app:/app              # hot-reload em dev; remova em produção
    depends_on:
      ollama-init:
        condition: service_completed_successfully  # garante que o modelo já foi baixado
      backend:
        condition: service_healthy                 # aguarda o backend Go estar pronto
    networks:
      - plataforma_net

  # ── Backend Go ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-go
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PORT=8080
    env_file:
      - .env
    depends_on:
      ollama-init:
        condition: service_completed_successfully  # garante que o modelo já foi baixado
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - plataforma_net

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    driver: local

# ── Rede interna ──────────────────────────────────────────────────────────
networks:
  plataforma_net:
    driver: bridge

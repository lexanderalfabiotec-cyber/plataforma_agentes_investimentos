services:

  # ── Ollama ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama  # persiste os modelos baixados
    networks:
      - plataforma_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Pull automático do modelo ─────────────────────────────────────────────
  # Roda uma vez e encerra. A interface não depende dele: cotações e indicadores
  # ficam disponíveis enquanto o modelo é baixado.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull "$${OLLAMA_MODEL}"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-lfm3}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - plataforma_net

  # ── Agentes Python (Streamlit) ────────────────────────────────────────────
  agentes:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: agentes-ia
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-lfm3}
      - BACKEND_URL=http://backend:8080
    env_file:
      - path: .env
        required: false
    volumes:
      - watchlist_data:/data  # preserva a lista de ativos entre recriações
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - plataforma_net

  # ── Backend Go ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-go
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - plataforma_net

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    driver: local
  watchlist_data:
    driver: local

# ── Rede interna ──────────────────────────────────────────────────────────
networks:
  plataforma_net:
    driver: bridge

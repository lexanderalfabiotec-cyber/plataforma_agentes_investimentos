[browser]
gatherUsageStats = false

[server]
# Sem isto, o monitor de arquivos percorre a .venv e esgota o limite de inotify.
folderWatchBlacklist = [".venv", "tests"]

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
# Tema inicial; o seletor de sol e lua muda esta opção em tempo de execução.
base = "light"
primaryColor = "#2a78d6"
